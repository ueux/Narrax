# Local development database with pgvector.
# Usage: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: narrax-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narrax}
      POSTGRES_USER: ${POSTGRES_USER:-narrax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narrax_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - narrax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-narrax} -d ${POSTGRES_DB:-narrax}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  narrax_pgdata:
